name: 🐛 Bug Report
description: Something isn't working as expected
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: I expected X, but Y happened.
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - CWE explorer
        - CVE and GHSA lookup
        - CVSS calculator
        - EPSS lookup
        - KEV checker
        - Affected versions builder
        - Package lookup
        - CNA directory
        - Something site-wide
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reliably triggers it. A link to the page with your input in it is perfect, since every tool keeps its state in the URL.
      placeholder: |
        1. Open https://security-reporting-toolbox.peng.ly/cvss?vector=...
        2. Click '...'
        3. See the wrong score
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Only if you're running your own copy (release tag, commit SHA, or Docker tag)
      placeholder: 1.2.3
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running it?
      options:
        - The hosted app
        - Docker
        - Self-hosted from source
        - Vercel or similar
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, plus Node version if you're running it yourself.
      placeholder: Firefox 141, Ubuntu 24.04, Node 22
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Anything from the browser console or the server. Formatted as code automatically, so no backticks needed.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/NotAFlightRisk/security-reporting-toolbox/blob/main/.github/CODE_OF_CONDUCT.md)
          required: true
